# builds static containr binaries for linux and publishes a github release
# when a v* tag is pushed. binaries link musl statically (no openssl, no
# glibc), so they run on any x86-64 or arm64 linux. the server page's
# "check for updates" and install.sh read these releases and install the
# matching containr-linux-<arch> binary after checking its .sha256 file.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: containr-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: containr-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc builds the bundled c code (sqlite, ring, zlib-ng, mimalloc)
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Check the tag matches the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "containr") | .version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match crate version $version" >&2
            exit 1
          fi

      # node and pnpm from mise.toml; the api build script builds the web ui
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}

      - name: Build
        run: |
          target_var="$(echo "${{ matrix.target }}" | tr '-' '_')"
          export "CC_${target_var}=musl-gcc"
          cargo build --release --locked -p containr --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/containr" "dist/${{ matrix.asset }}"
          cd dist
          file "${{ matrix.asset }}" | tee /dev/stderr | grep -q "static"
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          "./${{ matrix.asset }}" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}"

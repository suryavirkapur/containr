[workspace]
resolver = "2"
members = [
    "crates/containr",
    "crates/containr-cmd",
    "crates/containr-common",
    "crates/containr-api",
    "crates/containr-runtime",
    "crates/containr-proxy",
]

[workspace.package]
version = "0.1.17-alpha"
edition = "2021"
license = "MIT"
authors = ["containr"]

[workspace.dependencies]
# async runtime
tokio = { version = "1.53", features = ["full"] }

# web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# database

sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "chrono", "uuid"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.5"

# error handling
thiserror = "2"
anyhow = "1"

# crypto
argon2 = "0.6"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# http client
# rustls with the ring provider, installed at startup; no openssl, no aws-lc
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "charset", "http2", "system-proxy", "rustls-no-provider"] }

# uuid
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# time
chrono = { version = "0.4", features = ["serde"] }

# reverse proxy
http-body-util = "0.1"
bytes = "1"

# acme / ssl
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# misc
async-trait = "0.1"
futures = "0.3"
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
rand = "0.10"
base64 = "0.23"
url = "2"
trust-dns-resolver = { version = "0.23", default-features = false, features = ["tokio-runtime"] }
croner = "4.0.1"
globset = "0.4"

# docker api
bollard = "0.21"



# release binaries ship as one static file, so trade build time for size
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
